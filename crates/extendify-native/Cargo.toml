[package]
name = "extendify-native"
version = "0.0.1"
edition = "2024"

[lib]
name = "extendify_native"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
slim-detours-sys = "0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0"
features = [
    "Win32",
    "Win32_Security",
    "Win32_System",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dependencies]
anyhow.workspace = true
common.path = "../common"
ctor = "1.0.13"
log.workspace = true

[build-dependencies]
bindgen = "0"
