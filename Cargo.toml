[workspace]
members = [
	"crates/common",
    "crates/extendify-native",
	"crates/cli",

    "crates/oauth2aas",
    "crates/announcer",

    "crates/android-notifier",
    "crates/web-notifier",
    "crates/desktop-notifier"
]
resolver = "3"

[workspace.dependencies]
jiff = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "blocking"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
enum-iterator = "2"
gpapi = "6"
log = { version = "0.4", features = ["alloc"] }
owo-colors = "4"
regex = "1"
serde_json = "1"
tempfile = "3"
toml = "1"
zip = "8"
